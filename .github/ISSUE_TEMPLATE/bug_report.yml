name: Bug report
description: Report a reproducible app or build problem.
body:
  - type: input
    id: environment
    attributes:
      label: Environment
      description: App version, Android version/device or OS, JDK and Node versions.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Steps and expected behavior
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs
      description: Remove private notebook contents, passwords and signing details.
      render: text
