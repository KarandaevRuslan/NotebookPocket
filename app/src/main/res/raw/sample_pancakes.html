  <script id="6" type="module">
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const spoonFraction = (value, denominator) => {
          const units = Math.max(0, Math.round(value * denominator));
          const whole = Math.floor(units / denominator);
          const remainder = units % denominator;
          if (remainder === 0) return String(whole);
          const k = gcd(remainder, denominator);
          const num = remainder / k, den = denominator / k;
          const glyph = {"1/2":"½", "1/3":"⅓", "2/3":"⅔", "1/4":"¼", "3/4":"¾", "1/6":"⅙", "5/6":"⅚", "1/8":"⅛", "3/8":"⅜", "5/8":"⅝", "7/8":"⅞"};
          const part = glyph[`${num}/${den}`] || `${num}/${den}`;
          return whole > 0 ? `${whole}${part}` : part;
        };
        const fmt = (n) => new Intl.NumberFormat(lang === "ru" ? "ru-RU" : "en-GB", {maximumFractionDigits: 1}).format(n);
        const r = (() => {
          const eggs = Math.min(8, Math.max(1, Math.round(Number(settings.eggs) || 3)));
          const diameter = Math.min(32, Math.max(18, Number(settings.diameter) || 22));
          const stove = settings.stove || "induction";
          const taste = settings.taste || "sweet";
          const totalLiquid = eggs * 160;
          const availableMilk = Math.max(0, Math.min(1600, Number(settings.milkAvailable) || 0));
          const milk = Math.min(totalLiquid, availableMilk);
          const water = totalLiquid - milk;
          const leftoverMilk = availableMilk - milk;
          const flour = eggs * 70;
          const oilTbsp = eggs * 2 / 3;
          const sugarTbsp = eggs * (taste === "sweet" ? 7 / 9 : 1 / 6);
          // 1/4 tsp for 3 eggs is a suggested amount; the user did not state their salt dose.
          const saltTsp = eggs / 12;
          // Oil, sugar & salt displayed in spoons; no fictional exact ladle size.
          const oilDisplay = spoonFraction(oilTbsp, 3);
          const sugarDisplay = spoonFraction(sugarTbsp, 6);
          const saltDisplay = spoonFraction(saltTsp, 12);
          // Count is indicative: assume 70% of an 85 ml ladle, scaled by pan area.
          const estimatedBatterMl = totalLiquid + eggs * 45 + flour * .58 + oilTbsp * 15;
          const estimatedPortionMl = 60 * (diameter / 22) ** 2;
          const estimate = estimatedBatterMl / estimatedPortionMl;
          const yieldLow = Math.max(1, Math.floor(estimate * .83));
          const yieldHigh = Math.max(yieldLow + 1, Math.ceil(estimate * 1.2));
          const totalMinutes = Math.round((35 + estimate * 1.2) / 5) * 5;
          const firstLiquid = Math.round(totalLiquid / 3 / 5) * 5;
          return {eggs, diameter, stove, taste, totalLiquid, availableMilk, milk, water,
            leftoverMilk, flour, oilTbsp, sugarTbsp, saltTsp, oilDisplay, sugarDisplay,
            saltDisplay, yieldLow, yieldHigh, totalMinutes, firstLiquid,
            milkPct: milk / totalLiquid * 100, waterPct: water / totalLiquid * 100};
        })();
  </script>

              <span><i style="background:#63a9c0"></i>${L.liquidWater}: ${fmt(r.water)} ${L.ml}</span></div>
          </div>
          ${waterMessage ? html`<div class=${r.water > r.totalLiquid / 2 ? "blini-message warn" : "blini-message"}>${waterMessage}</div>` : ""}

  <script id="9" type="text/html">
    <div class="blini-heading"><h2>03 / Cook step by step</h2><p>Eight steps using your method: one drop of oil before each pancake, 70% of a ladle, a tilted pan, and two spatulas if needed.</p></div>
  </script>
  <script id="10" type="module">
    const step = view(Inputs.button([
          [L.back, value => Math.max(0, value - 1)],
          [L.next, value => Math.min(7, value + 1)],
          [L.restart, () => 0]
        ], {value: 0, label: L.navLabel}));
  </script>
  <script id="11" type="module">
    const steps = [
          {title:"Set everything out",body:`For ${r.eggs} egg(s), measure ${r.flour} g flour, ${fmt(r.milk)} ml milk${r.water ? ` and ${fmt(r.water)} ml water` : " (no water)"}, ${r.sugarDisplay} ${L.tbsp} sugar, ${r.oilDisplay} ${L.tbsp} neutral oil and ${r.saltDisplay} ${L.tsp} salt. Keep a small amount of extra oil beside the pan.`,note:"Have two broad, thin spatulas suitable for your cookware ready. Use level spoons. The salt amount is a suggested starting point; you did not record an exact amount."},
          {title:"Make a lump-free base",body:`Whisk ${r.eggs} egg(s) with sugar and salt. Add about ${r.firstLiquid} ml of the prepared liquid (milk, water or a mix). Whisk in ${r.flour} g flour in 2–3 portions to make a smooth, fairly thick base. Slowly pour in the remaining ${r.totalLiquid-r.firstLiquid} ml liquid.`,note:"This sequence helps avoid lumps. You do not need to whip the mixture into a foam."},
          {title:"Add the oil and rest",body:`Stir in ${r.oilDisplay} ${L.tbsp} neutral oil. Rest the batter for 20–30 minutes, then mix gently. It should pour freely from the ladle and coat the pan in a thin even layer without being watery.`,note:`Your ratio is ${r.flour} g flour to ${r.totalLiquid} ml liquid. Do not add flour pre-emptively — too much makes dry pancakes.`},
          {title:"Preheat the pan",body:r.stove === "induction" ? `Use an induction-compatible pan with a flat cooking base measuring ${r.diameter} cm. Start at 6 out of 9 (no Boost) and preheat moderately. In your trial, 7/9 overcooked pancakes, while 5/9 left them white. Before the FIRST pancake, add one drop of neutral oil and spread it into a very thin film.` : r.stove === "electric" ? `On a standard electric hob, warm the ${r.diameter} cm flat-base pan over medium heat and allow the temperature to even out. Before the first pancake, spread one drop of oil thinly across the surface.` : `On a gas hob, warm the pan with a ${r.diameter} cm flat base over a moderate flame. Keep flames underneath the base. Spread one drop of oil thinly before the first pancake.`,note:"Even at 6/9, actual heat varies. Do not overheat an empty nonstick pan or let the oil smoke."},
          {title:"Pour about 70% of a ladle",body:`Hold the pan at a slight angle. Fill roughly 70% of your ladle, pour onto the pan and immediately tilt and rotate it smoothly to spread a thin layer across the full ${r.diameter} cm flat base. Put the pan back on the hob promptly.`,note:"70% refers to your own ladle, not a fixed number of millilitres. If the layer is too thick or leaves large bare spots, adjust the next pour."},
          {title:"Flip as soon as the top just dries",body:"Watch the surface: it should just begin to turn matte and lose its wet shine, and the edge should start to lift. Do not wait for deep browning on the first side. Loosen the edge carefully and check that the pancake can hold together; if it is still visibly wet and fragile, give it a few more seconds without pulling. Then flip.",note:"If one spatula is not enough: lift the rim with the first, slide the SECOND spatula UNDER the first and further towards the centre. Support with both spatulas and turn in one gentle motion. This is your two-spatula backup method."},
          {title:"Cook the second side very briefly",body:"Stay by the pan after flipping. The second side browns much faster: let it set only briefly and remove the pancake immediately while soft. Do not fry until dark, or it can dry out and burn.",note:"Before EVERY next pancake, add another drop of oil, spread it thinly, pour ~70% of a ladle into the tilted pan and repeat. If the pan accumulates too much heat at 6/9, reduce power."},
          {title:"Stack, cover and serve",body:`Stack the finished pancakes and cover with a plate or lid to retain moisture. With these settings, expect roughly ${r.yieldLow}–${r.yieldHigh} pancakes, though the actual result depends on your ladle size. Serve with your favourite toppings.`,note:"Your three key references: 210 g flour for 3 eggs without unnecessary extras, 6/9 on your induction hob, and a very quick second-side cook. Never leave a hot pan unattended."}
        ];
  </script>

  <script id="13" type="text/html">
    <div class="blini-heading"><h2>Quick troubleshooting</h2><p>Check flipping timing and induction power before you change the flour ratio.</p></div>
    <section class="blini-help">
    <article><h3>The pancake tears when lifted</h3><p>Do not yank it by one edge. Wait until the top is lightly matte, loosen around the rim, then slide a second spatula underneath the first to increase support. If it still tears, let the batter rest another 10 minutes. Only then consider adding flour 1 tsp at a time to the batch, mixed with a little batter first.</p></article>
    <article><h3>It browns too fast at 6/9</h3><p>Try a shorter preheat or reduce to 5/9 if your pan has built up too much heat. Flip as the top starts to dry, not when the bottom is deeply brown. Your 7/9 trial already overcooked them, so do not use that as the starting point.</p></article>
    <article><h3>It stays pale or sticks</h3><p>Check that the pan is warm enough and lightly oiled before each pancake. If 5/9 leaves the pancake white, try 6/9. Sticking depends on the coating too, not only the amount of flour.</p></article>
    <article><h3>The pancake turns dry or brittle</h3><p>Remove it almost immediately after flipping: the second side browns much faster. Do not add more flour. Stack and cover the finished pancakes to keep them soft.</p></article>
    <article><h3>The batter will not spread</h3><p>After a 20–30 minute rest, check the consistency. If the batter will not spread thinly on a tilted pan, add 10–15 ml milk or water, stir and try one pancake. This changes the tested ratio.</p></article>
    <article><h3>A single spatula is not enough</h3><p>Slip one thin spatula under the rim; then slide the second underneath the first and further towards the centre. Support the pancake with both and turn gently. Use tools safe for nonstick coatings.</p></article>
    </section>
  </script>
