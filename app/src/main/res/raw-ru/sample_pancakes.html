  <script id="6" type="module">
    const gcd = (a, b) => b ? gcd(b, a % b) : a;
        const spoonFraction = (value, denominator) => {
          const units = Math.max(0, Math.round(value * denominator));
          const whole = Math.floor(units / denominator);
          const remainder = units % denominator;
          if (remainder === 0) return String(whole);
          const k = gcd(remainder, denominator);
          const num = remainder / k, den = denominator / k;
          const glyph = {"1/2":"½", "1/3":"⅓", "2/3":"⅔", "1/4":"¼", "3/4":"¾", "1/6":"⅙", "5/6":"⅚", "1/8":"⅛", "3/8":"⅜", "5/8":"⅝", "7/8":"⅞"};
          const part = glyph[`${num}/${den}`] || `${num}/${den}`;
          return whole > 0 ? `${whole}${part}` : part;
        };
        const fmt = (n) => new Intl.NumberFormat(lang === "ru" ? "ru-RU" : "en-GB", {maximumFractionDigits: 1}).format(n);
        const r = (() => {
          const eggs = Math.min(8, Math.max(1, Math.round(Number(settings.eggs) || 3)));
          const diameter = Math.min(32, Math.max(18, Number(settings.diameter) || 22));
          const stove = settings.stove || "induction";
          const taste = settings.taste || "sweet";
          const totalLiquid = eggs * 160;
          const availableMilk = Math.max(0, Math.min(1600, Number(settings.milkAvailable) || 0));
          const milk = Math.min(totalLiquid, availableMilk);
          const water = totalLiquid - milk;
          const leftoverMilk = availableMilk - milk;
          const flour = eggs * 70;
          const oilTbsp = eggs * 2 / 3;
          const sugarTbsp = eggs * (taste === "sweet" ? 7 / 9 : 1 / 6);
          // 1/4 tsp for 3 eggs is a suggested amount; the user did not state their salt dose.
          const saltTsp = eggs / 12;
          // Oil, sugar & salt displayed in spoons; no fictional exact ladle size.
          const oilDisplay = spoonFraction(oilTbsp, 3);
          const sugarDisplay = spoonFraction(sugarTbsp, 6);
          const saltDisplay = spoonFraction(saltTsp, 12);
          // Count is indicative: assume 70% of an 85 ml ladle, scaled by pan area.
          const estimatedBatterMl = totalLiquid + eggs * 45 + flour * .58 + oilTbsp * 15;
          const estimatedPortionMl = 60 * (diameter / 22) ** 2;
          const estimate = estimatedBatterMl / estimatedPortionMl;
          const yieldLow = Math.max(1, Math.floor(estimate * .83));
          const yieldHigh = Math.max(yieldLow + 1, Math.ceil(estimate * 1.2));
          const totalMinutes = Math.round((35 + estimate * 1.2) / 5) * 5;
          const firstLiquid = Math.round(totalLiquid / 3 / 5) * 5;
          return {eggs, diameter, stove, taste, totalLiquid, availableMilk, milk, water,
            leftoverMilk, flour, oilTbsp, sugarTbsp, saltTsp, oilDisplay, sugarDisplay,
            saltDisplay, yieldLow, yieldHigh, totalMinutes, firstLiquid,
            milkPct: milk / totalLiquid * 100, waterPct: water / totalLiquid * 100};
        })();
  </script>
  <script id="7" type="text/html">
    <div class="blini-heading"><h2>02 / Ингредиенты на выбранную порцию</h2><p>Отправная точка — замес на 3 яйца. Сахар и масло — в столовых ложках, соль — в чайных; дробные количества допустимы.</p></div>

  <script id="9" type="text/html">
    <div class="blini-heading"><h2>03 / Готовим по шагам</h2><p>8 шагов именно под твой способ: масло перед каждым блином, 70% половника, наклонённая сковорода и переворот двумя лопатками при необходимости.</p></div>

  <script id="10" type="module">
    const step = view(Inputs.button([
          [L.back, value => Math.max(0, value - 1)],
          [L.next, value => Math.min(7, value + 1)],
          [L.restart, () => 0]
        ], {value: 0, label: L.navLabel}));
  </script>
  <script id="11" type="module">
    const steps = [
          {title:"Подготовь всё заранее",body:`На ${r.eggs} яйц(а) отмерь ${r.flour} г муки, ${fmt(r.milk)} мл молока${r.water ? ` и ${fmt(r.water)} мл воды` : " (воду не добавляй)"}, ${r.sugarDisplay} ${L.tbsp} сахара, ${r.oilDisplay} ${L.tbsp} растительного масла и ${r.saltDisplay} ${L.tsp} соли. Налей отдельно чуть-чуть масла для сковороды.`,note:"Не забудь две широкие тонкие лопатки, подходящие для покрытия сковороды. Ложки без горки; количество соли — предложенный ориентир, не точная доза из твоего опыта."},
          {title:"Замешай основу без комков",body:`Размешай ${r.eggs} яйц(а) с сахаром и солью венчиком. Влей примерно ${r.firstLiquid} мл подготовленной жидкости (молока или смеси с водой). В 2–3 приёма добавь ${r.flour} г муки, вымешивая густую гладкую основу. Долей оставшиеся ${r.totalLiquid-r.firstLiquid} мл жидкости постепенно.`,note:"Так мука лучше распределится и комков будет меньше. Не взбивай тесто до устойчивой пены."},
          {title:"Масло в тесто и пауза",body:`Вмешай ${r.oilDisplay} ${L.tbsp} растительного масла и оставь тесто на 20–30 минут. После паузы осторожно перемешай. Оно должно свободно литься из половника и покрывать дно тонким ровным слоем, не становясь водянистым.`,note:`Твоя пропорция — ${r.flour} г муки на ${r.totalLiquid} мл жидкости. Не загущай заранее: это прямой путь к сухим блинам.`},
          {title:"Разогрей сковороду",body:r.stove === "induction" ? `Поставь на индукцию сковороду с рабочим плоским дном ${r.diameter} см. Начни с 6 из 9 без Boost и прогрей умеренно. В твоём опыте 7/9 пережаривало, 5/9 оставляло блины белыми. Перед ПЕРВЫМ блином нанеси на поверхность каплю растительного масла, распределив её очень тонко.` : r.stove === "electric" ? `На обычной электроплите разогрей сковороду с плоским дном ${r.diameter} см на среднем уровне. Дай температуре выровняться. Перед первым блином добавь каплю растительного масла и распределяй её тонко.` : `На газовой плите разогрей сковороду с плоским дном ${r.diameter} см на умеренном огне. Не допускай пламени выше дна. Перед первым блином добавь каплю растительного масла и распредели её по поверхности.`,note:"Даже при мощности 6/9 следи за фактической температурой. Не перегревай пустую антипригарную сковороду и не доводи масло до дыма."},
          {title:"Налей около 70% половника",body:`Держи сковороду слегка под наклоном. Набери примерно 70% своего половника теста, вылей на сковороду и сразу плавно поворачивай её, чтобы тесто тонко распределилось по всему рабочему дну ${r.diameter} см. Возвращай сковороду на конфорку без задержки.`,note:"70% — доля именно твоего половника, а не фиксированное число миллилитров. Если появились толстые складки или проплешины, скорректируй объём следующей порции."},
          {title:"Переверни сразу после лёгкого подсыхания",body:"Следи за верхней поверхностью: она должна только слегка подсохнуть и потерять выраженный жидкий блеск, а край — начать отходить. Не жди тёмно-коричневого цвета первой стороны. Аккуратно подведи тонкую лопатку под край и проверь, держится ли блин целиком; если он ещё совсем сырой, подожди несколько секунд, не отрывая силой. Когда держится — переворачивай.",note:"Если одна лопатка не справляется: первой поддень край, вторую заведи СНИЗУ под первую и продвинь глубже к центру. Поддержи блин обеими и переверни без рывка. Это твой способ спасения нежного блина."},
          {title:"Вторая сторона — совсем коротко",body:"После переворота не отходи от сковороды. Вторая сторона румянится заметно быстрее первой: дай ей лишь слегка схватиться и сразу снимай блин, пока он мягкий. Не оставляй его жариться до тёмного цвета — быстро пересушится или подгорит.",note:"Перед КАЖДЫМ следующим блином снова добавляй каплю растительного масла, распределяй тонко, наливай ~70% половника на наклонённую сковороду и повторяй. Если на 6/9 стало слишком жарко из-за накопленного тепла — убавь мощность."},
          {title:"Сложи стопкой и подавай",body:`Переложи готовые блины стопкой и прикрой тарелкой или крышкой, чтобы не теряли влагу. На твоих настройках ориентир — ${r.yieldLow}–${r.yieldHigh} шт., но число зависит от реального размера половника. Подавай с любимыми добавками.`,note:"Главные три опоры рецепта: 210 г муки на 3 яйца без лишних добавок, мощность 6/9 на твоей индукции и очень короткая обжарка после переворота. Не оставляй горячую сковороду без присмотра."}
        ];
  </script>

  <script id="13" type="text/html">
    <div class="blini-heading"><h2>Быстро исправить проблему</h2><p>Сначала проверь момент переворота и нагрев на индукции, а уже потом меняй пропорции.</p></div>
    <section class="blini-help">
    <article><h3>Блин рвётся на лопатке</h3><p>Не пытайся резко поднять его за один край. Подсуши верх до лёгкой матовости, пройди по кромке и подведи вторую лопатку снизу под первую, расширяя опору. Если всё ещё рвётся, дай тесту отдохнуть ещё 10 минут. Только после этого пробуй добавлять муку по 1 ч. л. на замес, предварительно размешав с небольшим количеством теста.</p></article>
    <article><h3>На 6/9 блин быстро темнеет</h3><p>Начни с менее продолжительного прогрева или убавь до 5/9, если твоя сковорода накопила слишком много тепла. Переворачивай при лёгком подсыхании, не дожидаясь тёмной корки. На 7/9 у тебя уже подгорало — не используй его как базовый режим.</p></article>
    <article><h3>Блин остаётся бледным или прилипает</h3><p>Убедись, что сковорода достаточно прогрета, а перед каждым блином есть тонкая капля масла. Если на 5/9 белеет без румянца, вернись к 6/9. Прилипание может зависеть от покрытия, не только от муки.</p></article>
    <article><h3>Блин сухой или ломкий</h3><p>Снимай почти сразу после переворота: вторая сторона румянится гораздо быстрее. Не досыпай муку. Готовые блины складывай стопкой и прикрывай, чтобы сохранить мягкость.</p></article>
    <article><h3>Тесто густое, плохо растекается</h3><p>После 20–30 минут отдыха проверь текучесть. Если половник не распределяется тонко по наклонённой сковороде, добавь 10–15 мл молока или воды, размешай и испеки пробный блин. Добавка меняет исходную пропорцию.</p></article>
    <article><h3>Одна лопатка не справляется</h3><p>Подведи первую тонкую лопатку под край, затем вторую — ниже, под первую и глубже к центру. Поддерживая блин двумя лопатками, переверни плавно. На антипригарном покрытии используй лопатки, которые его не царапают.</p></article>
    </section>
  </script>
